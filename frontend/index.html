<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rhizome — Membership, derived not assigned</title>
    <meta
      name="description"
      content="Rhizome is a protocol for programmable, relationship-derived membership on Monad. Communities define which relationships count, and membership is evaluated onchain."
    />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Social / link-preview thumbnail -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rhizome" />
    <meta property="og:title" content="Rhizome — Membership, derived not assigned" />
    <meta
      property="og:description"
      content="Communities that form from relationships, not ownership. Membership evaluated live onchain."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rhizome — Membership, derived not assigned" />
    <meta
      name="twitter:description"
      content="Communities that form from relationships, not ownership."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Body/UI font: General Sans (Fontshare) — geometric grotesk. -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <!-- Headline font: Plus Jakarta Sans — rounded geometric, closer to
         Ondo's warmer display type. Headlines only, body stays General Sans. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Editorial serif: Fraunces — used sparingly for the large stacked
         numbers/labels in the "protocol layers" list, echoing the
         high-contrast serif numerals used on premium institutional
         reference sites. Not used anywhere else in the type system. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
